# shamsiyev.uz — statik sayt (GitHub Pages o'rniga, 2026-09-10)
# Asosiy domen: https://shamsiyev.uz. www va http unga yo'naltiriladi.
# Obsidian: [[nginx va certbot]], [[Deploy va kesh tartibi]], [[SELinux va systemd EnvironmentFile]]

# --- HTTP: faqat ACME va HTTPS ga yo'naltirish ---
server {
    listen 80;
    listen [::]:80;
    server_name shamsiyev.uz www.shamsiyev.uz;

    # Let's Encrypt tekshiruvi — HTTPS yo'naltirishdan OLDIN turishi shart
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://shamsiyev.uz$request_uri;
    }
}

# --- HTTPS: www -> apex ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shamsiyev.uz;

    ssl_certificate     /etc/letsencrypt/live/shamsiyev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shamsiyev.uz/privkey.pem;

    return 301 https://shamsiyev.uz$request_uri;
}

# --- HTTPS: asosiy sayt ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shamsiyev.uz;

    ssl_certificate     /etc/letsencrypt/live/shamsiyev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shamsiyev.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    root /var/www/shamsiyev.uz;
    index index.html;

    access_log /var/log/nginx/shamsiyev.uz.access.log;
    error_log  /var/log/nginx/shamsiyev.uz.error.log;

    # Xavfsizlik sarlavhalari (_headers faylining o'rniga)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Tashrif hisoblagichi. Ilgari Cloudflare Function track.shamsiyev.uz ga
    # uzatardi — u DNS'dan yo'qolgan. Hozircha jim 204; kerak bo'lsa shu yerda
    # proxy_pass qo'yiladi. Tashriflar baribir logda qoladi.
    # ⚠️ POST qabul qiladigan yo'l uchun alohida location shart, aks holda 405.
    location = /api/track {
        access_log /var/log/nginx/shamsiyev.uz.track.log;
        return 204;
    }
    location /api/ { return 404; }

    # HTML doim yangi kelsin — aks holda eski sahifa keshda qolib ketadi.
    # ⚠️ nginx qoidasi: location ichida add_header bo'lsa, server darajasidagi
    # BARCHA add_header bekor bo'ladi — shu sabab xavfsizlik sarlavhalari
    # bu yerda qayta yozilgan. Yuqoridagilarni o'zgartirsangiz, bu yerni ham.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location /assets/images/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /assets/docs/   { expires 7d; add_header Cache-Control "public"; }
    # CSS/JS ?v= bilan versiyalanadi, lekin cv/resume ularni versiyasiz chaqiradi
    location /assets/css/    { expires 1h; add_header Cache-Control "public, must-revalidate"; }
    location /assets/js/     { expires 1h; add_header Cache-Control "public, must-revalidate"; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
