<!-- Belgi va mavzu BIRINCHI CHIZILISHDAN OLDIN qo'yiladi (miltillamasligi uchun).
     Ikki marta ishlaydi: darhol (splash + head'dagi link'lar) va DOMContentLoaded'da
     (sidebar logosi hujjatda pastroqda turadi). Saqlangan belgi bo'lmasagina fayl
     yo'liga tushamiz — u ham `app_icon_version` bilan, aks holda brauzer eski
     keshlangan rasmni qaytarardi. -->
<script>(function(){
  function iconSrc(){try{
    var ic=localStorage.getItem('app_custom_icon_192')||localStorage.getItem('app_custom_icon');
    if(ic)return ic;
    var v=localStorage.getItem('app_icon_version')||'';
    return 'assets/icons/custom-app-icon-192.png'+(v?'?v='+v:'');
  }catch(e){return 'assets/icons/custom-app-icon-192.png';}}
  function apply(){var s=iconSrc();document.querySelectorAll('[data-app-icon]').forEach(function(el){
    if(el.tagName==='LINK')el.setAttribute('href',s);else el.src=s;});}
  apply();
  document.addEventListener('DOMContentLoaded',apply);
  try{var th=localStorage.getItem('app_theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
})();</script>
