name: Subtitr Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop_requirements.txt
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r desktop_requirements.txt mypy
      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests
      - name: Mypy (non-blocking while legacy annotations are improved)
        continue-on-error: true
        run: .venv/bin/mypy

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop player dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        working-directory: subtitr_app
        run: |
          flutter pub get
          flutter analyze
      - name: Widget tests
        working-directory: subtitr_app
        run: flutter test
