# Subtitr Desktop loyihasi uchun mypy --strict konfiguratsiyasi.
# Nima uchun: Kod to'liq tiplangan bo'lib (barcha funksiyalarda tip annotatsiyalari mavjud),
# statik tip tahlilini eng qat'iy (strict) darajada nazorat qilish uchun mo'ljallangan.

[mypy]
# Python 3.12 tili versiyasi
python_version = 3.12

# Qat'iy rejim bayroqlari (--strict ekvivalenti):
# Barcha funksiyalarda turlar aniq ko'rsatilgan bo'lishi shart
strict = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_return_any = True
warn_unreachable = True
warn_unused_configs = True

# Tekshiriladigan fayl va modullar
files = subtitr, desktop_processor.py

# Uchinchi tomon tashqi kutubxonalari:
# Rasmiy tip stablari (stubs / py.typed) bo'lmagan paketlar uchun
# soxta xatolar (stub missing) chiqmasligi uchun ignore_missing_imports yoqiladi.
[mypy-docx.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-faster_whisper.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-google.genai.*]
ignore_missing_imports = True

[mypy-groq.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True
