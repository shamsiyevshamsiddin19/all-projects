name: Yordamchi CI / Code Quality

on:
  push:
    branches: [main, master]
    paths:
      - '16-yordamchi-productivity-suite/yordamchi-sayt/**'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '16-yordamchi-productivity-suite/yordamchi-sayt/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Logic Tests (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 16-yordamchi-productivity-suite/yordamchi-sayt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run frontend tests
        run: node tests/run.js

  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 16-yordamchi-productivity-suite/yordamchi-sayt/backend_py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 16-yordamchi-productivity-suite/yordamchi-sayt/backend_py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        run: python -m pytest tests/ -v
