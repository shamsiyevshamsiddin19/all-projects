name: Wstore Django tests
on:
  push:
    paths: ['15-wstore-digital-marketplace/django/**', '.github/workflows/wstore-tests.yml']
  pull_request:
    paths: ['15-wstore-digital-marketplace/django/**', '.github/workflows/wstore-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 15-wstore-digital-marketplace/django
    env:
      DEBUG: 'True'
      DEMO_MODE: 'False'
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 15-wstore-digital-marketplace/django/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
