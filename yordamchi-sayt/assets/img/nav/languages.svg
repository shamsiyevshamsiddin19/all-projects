<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-lang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="globe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="glow-lang" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bg-lang)"/>
  <rect x="1" y="1" width="62" height="30" rx="17" fill="#ffffff" fill-opacity="0.15"/>
  <g filter="url(#glow-lang)">
    <circle cx="32" cy="32" r="17" fill="url(#globe-grad)"/>
    <!-- Continents / Grid -->
    <ellipse cx="32" cy="32" rx="7.5" ry="17" fill="none" stroke="#0284c7" stroke-width="2.2"/>
    <line x1="15" y1="32" x2="49" y2="32" stroke="#0284c7" stroke-width="2.2"/>
    <line x1="18" y1="23" x2="46" y2="23" stroke="#0284c7" stroke-width="1.8" opacity="0.7"/>
    <line x1="18" y1="41" x2="46" y2="41" stroke="#0284c7" stroke-width="1.8" opacity="0.7"/>
    <!-- Sparkle / Badge -->
    <circle cx="45" cy="19" r="5" fill="#f59e0b"/>
    <polygon points="45,15.5 46.2,18 48.7,19 46.2,20 45,22.5 43.8,20 41.3,19 43.8,18" fill="#ffffff"/>
  </g>
</svg>