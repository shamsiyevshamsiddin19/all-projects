<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-sport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold-trophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow-sport" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bg-sport)"/>
  <rect x="1" y="1" width="62" height="30" rx="17" fill="#ffffff" fill-opacity="0.15"/>
  <g filter="url(#glow-sport)">
    <!-- Trophy cup -->
    <path d="M22 17 L42 17 L40 33 C40 38 34 40 32 40 C30 40 24 38 24 33 Z" fill="url(#gold-trophy)"/>
    <!-- Trophy handles -->
    <path d="M22 20 L16 20 C14 20 14 28 20 28 L23 28" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M42 20 L48 20 C50 20 50 28 44 28 L41 28" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <!-- Trophy stem & base -->
    <rect x="30" y="40" width="4" height="5" fill="#f59e0b"/>
    <rect x="22" y="45" width="20" height="5" rx="2.5" fill="#ffffff"/>
    <!-- Star on cup -->
    <polygon points="32,23 33.3,26.5 37,26.5 34,28.7 35.2,32 32,30 28.8,32 30,28.7 27,26.5 30.7,26.5" fill="#ffffff"/>
  </g>
</svg>