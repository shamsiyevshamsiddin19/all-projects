<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-kun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cal-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="glow-kun" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bg-kun)"/>
  <rect x="1" y="1" width="62" height="30" rx="17" fill="#ffffff" fill-opacity="0.15"/>
  <g filter="url(#glow-kun)">
    <!-- Calendar base -->
    <rect x="15" y="18" width="34" height="32" rx="7" fill="url(#cal-body)"/>
    <!-- Red Header -->
    <path d="M15 25 C15 21 17 18 22 18 L42 18 C47 18 49 21 49 25 L49 26 L15 26 Z" fill="#ef4444"/>
    <!-- Binder rings -->
    <rect x="21" y="14" width="4" height="7" rx="2" fill="#ffffff"/>
    <rect x="39" y="14" width="4" height="7" rx="2" fill="#ffffff"/>
    <!-- Checkmark inside -->
    <path d="M24 38 L29 43 L40 32" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>