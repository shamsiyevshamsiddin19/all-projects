<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Clock Outer Ring -->
  <circle cx="64" cy="64" r="38" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="4"/>

  <!-- Top Timer Knob -->
  <rect x="58" y="18" width="12" height="6" rx="3" fill="#38bdf8"/>
  <rect x="62" y="24" width="4" height="4" fill="#38bdf8"/>

  <!-- Ticks -->
  <line x1="64" y1="32" x2="64" y2="37" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="91" x2="64" y2="96" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="64" x2="37" y2="64" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="91" y1="64" x2="96" y2="64" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Clock Hands pointing to 25 mins style -->
  <line x1="64" y1="64" x2="64" y2="42" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="82" y2="74" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="4.5" fill="#38bdf8"/>
</svg>
