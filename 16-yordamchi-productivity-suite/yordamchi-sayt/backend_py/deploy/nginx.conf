# Yordamchi — nginx (HTTPS) — y.wstore.uz
# /etc/nginx/conf.d/yordamchi.conf

# --- HTTP: ACME + HTTPS redirect ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name y.wstore.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: asosiy sayt + bot ---
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name y.wstore.uz;

    ssl_certificate     /etc/letsencrypt/live/y.wstore.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/y.wstore.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/yordamchi/Yordamchisayt;
    index index.html;
    client_max_body_size 55m;

    # ACME (yangilash uchun HTTPS'da ham ruxsat)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Maxfiy papkalar
    location ~ ^/(config|database|logs|backend_py|Boostdaybot)(/|$) { return 404; }
    location ~ /\.  { return 404; }

    # SPA shell — hech qachon keshlanmasin (doim eng yangisi kelsin)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    # --- Sayt backend (8000) ---
    location = /api {
        proxy_pass http://127.0.0.1:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Boostday bot (8090) ---
    location = /boost/app {
        proxy_pass http://127.0.0.1:8090/boost/app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /boost/upload {
        proxy_pass http://127.0.0.1:8090/boost/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
    location = /boost/webhook {
        proxy_pass http://127.0.0.1:8090/boost/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }
    location = /boost/api {
        proxy_pass http://127.0.0.1:8090/boost/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        add_header X-Content-Type-Options nosniff;
    }

    # SPA: barcha boshqa yo'llar index.html'ga (hash-router client tomonda ishlaydi)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
