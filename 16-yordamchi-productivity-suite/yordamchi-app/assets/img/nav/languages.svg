<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg_lang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="sh_lang"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bg_lang)"/>
  <rect x="1.5" y="1.5" width="61" height="28" rx="16.5" fill="#ffffff" fill-opacity="0.18"/>
  <g filter="url(#sh_lang)">
    <!-- Open book pages -->
    <path d="M32 24 C28 20 20 20 14 22 L14 45 C20 43 28 43 32 47 C36 43 44 43 50 45 L50 22 C44 20 36 20 32 24 Z" fill="#ffffff"/>
    <!-- Book spine divider -->
    <line x1="32" y1="24" x2="32" y2="47" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Letter 'A' on left page -->
    <text x="22.5" y="37" font-family="sans-serif" font-size="13" font-weight="800" fill="#0284c7" text-anchor="middle">A</text>
    <!-- Letter 'Я' on right page -->
    <text x="41.5" y="37" font-family="sans-serif" font-size="13" font-weight="800" fill="#4f46e5" text-anchor="middle">Я</text>
    <!-- Sparkle on top corner -->
    <polygon points="48,15 49.2,17.5 51.7,18.5 49.2,19.5 48,22 46.8,19.5 44.3,18.5 46.8,17.5" fill="#fbbf24"/>
  </g>
</svg>