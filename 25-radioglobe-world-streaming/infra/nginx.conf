# RadioGlobe — production reverse proxy (nginx).
# Serverda ishlayotgan konfiguratsiya shu bo'lishi kerak.
# O'rnatish:  sudo cp nginx.conf /etc/nginx/conf.d/radio.shamsiyev.uz.conf
#             sudo nginx -t && sudo systemctl reload nginx

# Oqim proxysi uchun alohida zona: bir IP dan ko'p ulanish ochilmasin
limit_conn_zone $binary_remote_addr zone=stream_conn:10m;
limit_req_zone  $binary_remote_addr zone=api_req:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name radio.shamsiyev.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name radio.shamsiyev.uz;

    # --- TLS (certbot boshqaradi) ---
    ssl_certificate     /etc/letsencrypt/live/radio.shamsiyev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.shamsiyev.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Xavfsizlik header'lari ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    # CSP: maplibre WebGL uchun blob: worker kerak; stansiya logolari uchun img-src ochiq
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    client_max_body_size 2m;
    server_tokens off;

    # --- Audio oqim proxysi ---
    # Buferlash O'CHIRILGAN: jonli oqimda nginx buferlasa kechikish paydo bo'ladi.
    location /api/v1/stream/ {
        limit_conn stream_conn 3;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        # Audio allaqachon siqilgan — qayta siqish faqat CPU sarflaydi
        gzip off;
    }

    # --- Qolgan API ---
    location /api/ {
        limit_req zone=api_req burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        gzip on;
        gzip_types application/json application/geo+json;
        gzip_min_length 1024;
    }

    # --- Next.js statik fayllari ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Frontend ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        gzip on;
        gzip_types text/html text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
}
