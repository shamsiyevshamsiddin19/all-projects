services:
  postgres:
    image: postgres:16-alpine
    container_name: radioglobe_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: radioglobe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radioglobe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: radioglobe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: radioglobe_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/radioglobe
      REDIS_URL: redis://redis:6379/0
      PROXY_SECRET_KEY: radioglobe-production-secret-key-2026
      PROXY_BASE_URL: http://localhost:8000/api/v1/stream

  worker:
    build:
      context: ../apps/worker
      dockerfile: Dockerfile
    container_name: radioglobe_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/radioglobe
      REDIS_URL: redis://redis:6379/0

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: radioglobe_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

volumes:
  pgdata:
  redisdata:
