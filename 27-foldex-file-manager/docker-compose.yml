services:
  # 1. PostgreSQL ma'lumotlar bazasi
  postgres:
    image: postgres:16-alpine
    container_name: foldex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foldex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_foldex_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-foldex_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foldex_user} -d ${POSTGRES_DB:-foldex_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - foldex_network

  # 2. Foldex Web Admin Panel + aiogram Telegram Bot (FastAPI)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foldex_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-foldex_user}:${POSTGRES_PASSWORD:-secure_foldex_db_password}@postgres:5432/${POSTGRES_DB:-foldex_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-foldex_user}:${POSTGRES_PASSWORD:-secure_foldex_db_password}@postgres:5432/${POSTGRES_DB:-foldex_db}
      STORAGE_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - foldex_network

volumes:
  postgres_data:
    driver: local

networks:
  foldex_network:
    driver: bridge
