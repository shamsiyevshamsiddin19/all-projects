# ==============================================================================
# FOLDEX: Nginx Konfiguratsiyasi (foldex.shamsiyev.uz)
# Server: Oracle Cloud Stockholm (shamsiyev.uz)
# ==============================================================================

# 1. HTTP dan HTTPS ga avtomatik yo'naltirish
server {
    listen 80;
    listen [::]:80;
    server_name foldex.shamsiyev.uz;

    # Certbot SSL sertifikati olish uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Asosiy Server Bloki
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foldex.shamsiyev.uz;

    # SSL Sertifikatlari (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/foldex.shamsiyev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foldex.shamsiyev.uz/privkey.pem;

    # Zamonaviy SSL xavfsizlik sozlamalari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Katta hajmdagi fayllarni yuklash uchun cheklov (500 MB)
    client_max_body_size 500M;

    # Gzip siqish (Statik fayllar tezligi uchun)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Statik fayllarni kesh bilan uzatish
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Asosiy FastAPI + aiogram proksilash
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket va ulanish parametrlari
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Haqiqiy mijoz IP manzillari
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Katta fayllarni yuklashda timeout bo'lmasligi uchun vaqt chegaralari
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # Buferlash sozlamalari
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
